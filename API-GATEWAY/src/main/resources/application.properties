spring.application.name=API-GATEWAY
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=driver-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://driver-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/display/**

spring.cloud.gateway.server.webflux.routes[1].id=driver-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://driver-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/display/**

spring.cloud.gateway.server.webflux.routes[2].id=driver-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://driver-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/display/**